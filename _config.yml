title: "Arrashi Faris Saesarian Libinuko"
description: "Cybersecurity labs, technical projects, and learning notes."
url: ""
baseurl: ""
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

collections:
  labs:
    output: true
    permalink: /labs/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "labs"
    values:
      layout: article
      content_type: Lab
  - scope:
      path: ""
      type: "projects"
    values:
      layout: article
      content_type: Project
  - scope:
      path: ""
      type: "posts"
    values:
      layout: article
      content_type: Blog

plugins:
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
