---
layout: default
---
{%- comment -%} Simple content page (About, 404, any page you add). {%- endcomment -%}
<div class="container">
  <article class="page-content" aria-labelledby="page-title">
    <header class="page-header">
      <h1 id="page-title" class="page-title">{{ page.title }}</h1>
      {%- if page.description and page.description != '' %}
      <p class="page-intro">{{ page.description }}</p>
      {%- endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </article>
</div>
