# Builds the site with GitHub's official Jekyll action and deploys it to
# GitHub Pages on every push to `main`.
#
# To use this workflow: repository Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions".
#
# `actions/jekyll-build-pages` uses the same `github-pages` gem environment as
# the classic "Deploy from a branch" mode, so only GitHub Pages-supported
# plugins are available. See README.md, section "Deploying".
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
