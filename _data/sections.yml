# Per-content-type settings used by cards, article pages and listings.
# The keys match Jekyll collection names (`posts` is the built-in blog).
labs:
  url: /labs/
  name: Labs
  singular: lab
  plural: labs
  read_more: Read lab write-up
projects:
  url: /projects/
  name: Projects
  singular: project
  plural: projects
  read_more: Read project
posts:
  url: /blog/
  name: Blog
  singular: post
  plural: posts
  read_more: Read article
